<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>RGB Sliders</title>
</head>
<body>
 
  <div class="container">
    <div class="slider-group">
      <label for="red">Red</label>
      <div class="slider-row">
        <input type="range" id="red" min="0" max="255" value="128">
        <span id="red-val">128</span>
      </div>
    </div>
   
    <div class="slider-group">
      <label for="green">Green</label>
      <div class="slider-row">
        <input type="range" id="green" min="0" max="255" value="128">
        <span id="green-val">128</span>
      </div>
    </div>
   
    <div class="slider-group">
      <label for="blue">Blue</label>
      <div class="slider-row">
        <input type="range" id="blue" min="0" max="255" value="128">
        <span id="blue-val">128</span>
      </div>
    </div>
   
    <p id="hex-value">#808080</p>
  </div>
  <script src="script.js"></script>
 
</body>
</html>
